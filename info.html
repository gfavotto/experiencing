<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peak Prompt — Info</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
      }
    </style>
    <script type="module" crossorigin src="/experiencing/assets/info-Dl5lFVNv.js"></script>
    <link rel="modulepreload" crossorigin href="/experiencing/assets/three.module-HOKLy1Qc.js">
    <link rel="stylesheet" crossorigin href="/experiencing/assets/info-BJohi_fs.css">
  </head>
  <body class="is-info">
    <div class="info-stage" id="info-stage">
      <canvas id="info-float-canvas" aria-hidden="true"></canvas>
      <canvas id="info-canvas" aria-hidden="true"></canvas>
      <div class="info-copy" id="info-copy" hidden aria-hidden="true"></div>
      <h1 class="title info-title">
        <a
          class="title-home info-home"
          id="info-home"
          href="./"
          aria-label="Torna alla home"
        >
          <span class="title-peak">peak</span>
          <span class="title-prompt">prompt</span>
        </a>
      </h1>
      <p
        class="info-browse-hint"
        id="info-browse-hint"
        hidden
        aria-hidden="true"
      ></p>
      <a
        class="home-ring info-home-ring"
        id="info-home-ring"
        href="./?rings=1"
        aria-label="Torna alle circonferenze"
      ></a>
      <div class="lang-switch info-lang-switch" id="lang-switch" role="group" aria-label="Lingua">
        <div class="lang-switch-rail">
          <button type="button" class="lang-switch-btn" id="lang-it" data-lang="it">
            ita
          </button>
          <span class="lang-switch-sep" aria-hidden="true">/</span>
          <button type="button" class="lang-switch-btn" id="lang-en" data-lang="en">
            eng
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
